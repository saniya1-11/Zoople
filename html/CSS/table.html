<!DOCTYPE html>
<html>
<head>
    <title>Student Details Table</title>
    <style>
        
        table {
            width: 80%;
            border-collapse: collapse; 
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #2e7d32; 
            padding: 12px;
            text-align: left;
        }

    
        th {
            background-color: #1a242f;
            color: white;
        }

    
        tr:nth-child(even) {
            background-color: #e57373; 
        }

        
        h2 {
            font-family: sans-serif;
            font-size: 28px;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Class</th>
                <th>Age</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>

            </tr>

                <td>B</td>
            </tr>
            <tr>
                <td>3</td>

                <td>A+</td>
            </tr>
            <tr>
                <td>4</td>

            </tr>
             <tr>
                <td>2</td>

            </tr>
        </tbody>
    </table>

</body>
</html>
