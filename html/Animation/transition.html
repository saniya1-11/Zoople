<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes squaremove {

            0% {
                transform: translate(0,0);
            }


            50% {
                transform: translate(30px,30px);
            }

            100% {
                transform: translate(0,0);
            }
        }
        div {
            width: 100px;
            height: 100px;
            background: orange;
            animation: squaremove 3s Linear infinite;
        }
        </style>

    </head>
    <body>
       <div>hiiii</div>
    </body>




</html>
