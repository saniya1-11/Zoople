<!DOCTYPE html>
<html>
    <head>
        <title>my animation</title>
    </head>
    <style>
         @keyframes colorchange {
            0% {
                color: red;
            }
            20%{
                color: yellow;
            }
            100% {
                color: green;
            }
         }
         h1{
            animation-name: colorchange;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
         }










    </style>
    <body>
        <h1>Hello css animations!</h1>
    </body>






</html>
