<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .scene {
            perspective: 160px; 
            width: 120px;
            height: 120px;
            margin: 50px;
        }

        .card {
            width: 100%;
            height: 100%;
            background: rgb(19, 43, 150);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            transition: transform 0.9s;
            transform-style: preserve-3d;
        }

        .card h1 {
            margin: 0;
        }
        .card:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="card">
            <h1>3D</h1>
        </div>
    </div>

</body>
</html>
